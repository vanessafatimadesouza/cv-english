<body>
  <div class="noise" aria-hidden="true"></div>
  <header class="nav-shell"><a class="logo" href="index.html">VS<span>°</span></a><nav><a href="index.html#about">About</a><a href="index.html#projects">Projects</a><a href="index.html#contact">Contact</a></nav><a class="nav-cta" href="mailto:vanessafatima.desouza@gmail.com">Let's talk <span>↗</span></a></header>
  <main class="case-page" id="case-content"></main>
  <script>
    const project = new URLSearchParams(location.search).get('project') || 'ima';
    const cases = {
      ima: {tag:'PRODUCT DESIGN · DESIGN SYSTEM',title:'IMA — Agricultural Registry',lead:'How can a complex digital ecosystem stay clear, consistent, and scalable?',intro:'The Minas Gerais Agricultural Registry is a government system developed with the Minas Gerais Agricultural Institute (IMA) to manage and inspect producers and rural properties across the state. As lead designer, I created a complete, robust design system capable of supporting a large-scale government platform. The project involved thousands of Figma variables, hundreds of interconnected components, and a design architecture built for scalability and efficient maintenance. Beyond Figma, we used TypeScript, Node, and React to explore and validate complex, real-world product flows.',stats:[['3,500+','Figma variables'],['+8,000','connections'],['45+','components'],],image:'sidagro-mock.png',second:'conexoes-sidagro.png'},
      alumni: {tag:'UX/UI · COMMUNITY · EDUCATION',title:'Alumni ESAL UFLA',lead:'A digital experience that turns connection into impact for education.',intro:'An institutional platform that brings alumni together, celebrates ESAL-UFLA\'s history, and makes supporting the university simpler, clearer, and more human.',stats:[['R$2M+','potential impact'],['4','content areas'],['1','connected community'],],image:'alumni-tela-1.png',second:''},
      eco: {tag:'PRODUCT DESIGN · WEB',title:'Eco — Carbon Credits',lead:'Transparency connecting conservation projects with companies seeking to offset emissions.',intro:'A marketplace with impact metrics, clear navigation, and a more trustworthy buying experience.',stats:[['8.5M+','t CO₂'],['Real time','metrics'],['Marketplace','certified'],],image:'',second:''}
    };
    const c=cases[project]||cases.ima;
    document.body.classList.add(`project-${project}`);
    document.title=`${c.title} — Vanessa Souza`;
    document.querySelector('#case-content').innerHTML=`<a class="case-back" href="index.html#projects">← Back to projects</a><section class="case-hero"><div class="section-index">${c.tag}</div><h1>${c.title}<br><em>${c.lead}</em></h1><p class="case-intro">${c.intro}</p><div class="case-meta">${c.stats.map(s=>`<div><b>${s[0]}</b><span>${s[1]}</span></div>`).join('')}</div></section><section class="case-section"><div class="section-index">01 / CONTEXT</div><h2>Complexity calls for<br>clarity.</h2><p>The challenge was to make a broad product easier to understand through information architecture, reusable components, and workflows aligned with how people actually work.</p>${c.image?`<div class="case-visual"><img src="${c.image}" alt="${c.title} project mockup"></div>`:''}</section>${c.second?`<section class="case-section"><div class="section-index">02 / ECOSYSTEM</div><h2>A product designed<br>as a system.</h2><p>The map below represents the density of the project's relationships and paths. It communicates the scale of the work without exposing internal information.</p><div class="case-visual"><img src="${c.second}" alt="IMA project connection map"></div><p class="case-note">An anonymized view of connections across flows, screens, and components.</p></section><section class="case-section"><div class="section-index">03 / DESIGN PROCESS</div><h2>From problem<br>to structure.</h2><div class="case-meta"><div><b>01</b><span>Research<br>Analysis of government requirements and user needs</span></div><div><b>02</b><span>Architecture<br>Design-system structure and component definition</span></div><div><b>03</b><span>Prototyping<br>Advanced connections and interactive user flows</span></div></div></section>`:''}<footer class="case-footer"><a href="index.html#projects">← All projects</a><a href="index.html#contact">Let's talk ↗</a></footer>`;
    if (project === 'alumni') document.querySelector('#case-content').innerHTML = `<a class="case-back" href="index.html#projects">← Back to projects</a><section class="case-hero alumni-hero"><div class="section-index">${c.tag}</div><h1>${c.title}<br><em>${c.lead}</em></h1><p class="case-intro">${c.intro}</p><div class="case-meta">${c.stats.map(s=>`<div><b>${s[0]}</b><span>${s[1]}</span></div>`).join('')}</div></section><section class="case-section alumni-context"><div class="section-index">01 / CONTEXT</div><h2>Complexity calls for<br>clarity.</h2><p>The website brings together the people and stories behind ESAL-UFLA in an accessible, institutional, action-oriented experience. Its architecture balances the university's story, course content, and the invitation to donate.</p><div class="alumni-gallery"><figure class="alumni-gallery__hero"><img src="alumni-tela-1.png" alt="Alumni ESAL UFLA homepage"><figcaption>Institutional homepage: a welcoming entry point for the Alumni community.</figcaption></figure><figure><img src="alumni-tela-2.png" alt="Alumni ESAL UFLA course section"><figcaption>Programs: organized content introducing the university.</figcaption></figure></div></section><section class="case-section alumni-impact"><div class="section-index">02 / MAKING IMPACT CLEAR</div><h2>Donating also means<br>understanding the impact.</h2><p>The screens connect each contribution to tangible outcomes: scholarships, research, technology, and infrastructure. Visual communication turns a donation into active participation in the university's story.</p><div class="alumni-gallery alumni-gallery--reverse"><figure><img src="alumni-tela-3.png" alt="Alumni ESAL UFLA scholarships and research section"><figcaption>Impact areas presented clearly.</figcaption></figure><figure class="alumni-gallery__hero"><img src="alumni-tela-4.png" alt="Alumni ESAL UFLA Our History section"><figcaption>Institutional memory connected to the future.</figcaption></figure></div></section><section class="alumni-principles"><div class="section-index">03 / DESIGN DIRECTION</div><div class="alumni-principles__grid"><div><b>01</b><h3>Welcome</h3><p>An approachable visual language that invites different generations to see themselves in the institution.</p></div><div><b>02</b><h3>Organize</h3><p>Institutional information arranged in focused blocks for comfortable reading and direct navigation.</p></div><div><b>03</b><h3>Mobilize</h3><p>Donation calls to action positioned as a natural continuation of people's relationship with the university.</p></div></div></section><footer class="case-footer"><a href="index.html#projects">← All projects</a><a href="index.html#contact">Let's talk ↗</a></footer>`;
    if (project === 'eco') document.querySelector('#case-content').innerHTML = `<a class="case-back" href="index.html#projects">← Back to projects</a><section class="case-hero eco-hero"><div class="section-index">PRODUCT DESIGN · WEB</div><h1>Eco —<br>Carbon Credits<br><em>Transparency that turns conservation into value.</em></h1></section><section class="case-section eco-showcase"><div class="eco-showcase__intro"><div><div class="section-index">01 / PLATFORM</div><h2>A clear journey,<br>from impact to action.</h2></div><p>A complete platform connecting companies, projects, and carbon credits through a simple, trustworthy, data-driven experience.</p></div><div class="eco-shot-grid"><figure><img src="eco-tela-1.png" alt="Eco landing page"><figcaption>Landing page: value proposition, indicators, and entry points into the platform.</figcaption></figure><figure><img src="eco-tela-2.png" alt="Eco platform benefits"><figcaption>Benefits and trust criteria for credit trading.</figcaption></figure><figure><img src="eco-tela-3.png" alt="How Eco works"><figcaption>The user flow presented in simple, transparent steps.</figcaption></figure></div></section><section class="case-section eco-dashboard"><div class="section-index">02 / MANAGEMENT</div><h2>Data that supports<br>better decisions.</h2><p>The dashboard centralizes credits, reports, and simulations so every transaction can be tracked clearly.</p><div class="eco-shot-grid"><figure><img src="eco-tela-4.png" alt="Eco credit dashboard"><figcaption>Overview dashboard showing available credits.</figcaption></figure><figure><img src="eco-tela-5.png" alt="Eco sales reports"><figcaption>Reports with sales and revenue indicators.</figcaption></figure><figure><img src="eco-tela-6.png" alt="Eco sales table"><figcaption>Details of completed transactions.</figcaption></figure></div></section><section class="case-section eco-showcase"><div class="eco-showcase__intro"><div><div class="section-index">03 / MARKET</div><h2>Trade with<br>confidence.</h2></div><p>Filters, quotes, and calculators make the carbon market more accessible to people buying, selling, and tracking their own impact.</p></div><div class="eco-shot-grid"><figure><img src="eco-tela-7.png" alt="Eco credit simulator"><figcaption>A simulator for estimating values and comparing project types.</figcaption></figure><figure><img src="eco-tela-8.png" alt="Eco carbon market"><figcaption>A searchable marketplace with cards for available credits.</figcaption></figure></div></section><footer class="case-footer"><a href="index.html#projects">← All projects</a><a href="index.html#contact">Let's talk ↗</a></footer>`;
    const connectionSection = [...document.querySelectorAll('#case-content .case-section')].find(section => section.textContent.includes('02 / ECOSSISTEMA'));
    if (connectionSection) {
      const connectionVisual = connectionSection.querySelector('.case-visual');
      connectionVisual.innerHTML = `<div class="connection-map" aria-label="Visual map of connections between flows, screens, and components"><img src="${c.second}" alt="IMA project connection map"><span class="connection-map__legend"><i></i> relationship map</span><span class="connection-map__spotlight" aria-hidden="true"></span><span class="connection-map__node connection-map__node--one">G</span><span class="connection-map__node connection-map__node--two">G</span><span class="connection-map__node connection-map__node--three">↗</span><span class="connection-map__label connection-map__label--top"><strong>+8,000</strong>connections between flows</span><span class="connection-map__label connection-map__label--bottom"><strong>45+</strong>related components</span></div>`;
      const map = connectionVisual.querySelector('.connection-map');
      map.querySelectorAll('.connection-map__node').forEach(node => { if (node.textContent.trim() === 'G') node.remove(); });
      map.addEventListener('pointermove', event => { const rect = map.getBoundingClientRect(); map.style.setProperty('--mx', `${((event.clientX - rect.left) / rect.width) * 100}%`); map.style.setProperty('--my', `${((event.clientY - rect.top) / rect.height) * 100}%`); });
      map.addEventListener('pointerleave', () => { map.style.setProperty('--mx', '52%'); map.style.setProperty('--my', '48%'); });
      const ecosystemCopy = document.createElement('div');
      ecosystemCopy.className = 'ecosystem-copy';
      const ecosystemHeading = connectionSection.querySelector('h2');
      const ecosystemDescription = connectionSection.querySelector(':scope > p:not(.case-note)');
      ecosystemCopy.append(ecosystemHeading, ecosystemDescription);
      connectionSection.insertBefore(ecosystemCopy, connectionVisual);
    }
    document.querySelector('.case-hero').insertAdjacentHTML('beforeend', '<span class="case-scroll-note">SCROLL<i></i></span>');
    if (project === 'ima') document.querySelector('.case-hero').insertAdjacentHTML('afterend', `<section class="case-impact"><div class="impact-marquee"><span>+8,000 CONNECTIONS · 45+ COMPONENTS · FIGMA · TYPESCRIPT · REACT · NODE · PRODUCT DESIGN · DESIGN SYSTEM · IMA · MINAS GERAIS · GOVERNMENT · 3,500+ VARIABLES · </span><span aria-hidden="true">+8,000 CONNECTIONS · 45+ COMPONENTS · FIGMA · TYPESCRIPT · REACT · NODE · PRODUCT DESIGN · DESIGN SYSTEM · IMA · MINAS GERAIS · GOVERNMENT · 3,500+ VARIABLES · </span></div><div class="impact-stats">${c.stats.map(s=>`<div class="impact-stat"><b>${s[0]}</b><span>${s[1]}</span></div>`).join('')}</div></section><section class="case-about"><div class="case-about-label"><span>ABOUT THE PROJECT</span><h2>Clarity that<br>scales.</h2></div><p>${c.intro}</p></section>`);
    const firstSection = document.querySelector('#case-content .case-section');
    const heroIntro = document.querySelector('.case-hero .case-intro');
    const heroMeta = document.querySelector('.case-hero .case-meta');
    if (heroMeta) heroMeta.remove();
    if (heroIntro) heroIntro.remove();
    if (project === 'alumni') document.querySelector('.alumni-hero').insertAdjacentHTML('afterend', '<section class="alumni-about"><div class="alumni-about-title"><div class="section-index">01 / ABOUT THE PROJECT</div><h2>Connections that<br>transform.</h2></div><p>The ESAL UFLA Alumni Association strengthens bonds among the institution\'s alumni and supports the university\'s continued development.<br><br>I designed a complete digital platform that connects alumni, promotes networking events, and centralizes fundraising for educational projects.<br><br>The website prioritizes usability, donation transparency, and community engagement, resulting in greater participation and financial contributions.</p></section>');
    if (project === 'ima') {
      document.querySelector('.case-hero h1').innerHTML = 'IMA —<br>Agricultural<br>Registry<em>' + c.lead + '</em>';
      document.querySelector('.case-footer').insertAdjacentHTML('beforebegin', '<section class="tech-group"><div class="section-index">04 / TECHNICAL EXPLORATION</div><h3>We used code to explore the product.</h3><p>To validate complex real-world flows, we combined Figma prototypes with a functional layer built in code.</p><div class="tech-tags"><span>Figma</span><span>TypeScript</span><span>Node</span><span>React</span><span>+8,000 connections</span></div></section>');
      document.querySelector('.tech-group').insertAdjacentHTML('afterend', '<section class="case-quote"><p>"A design system is not a component library — it is a shared language that enables scale without sacrificing coherence."</p></section>');
      document.querySelector('.case-quote').insertAdjacentHTML('afterend', '<section class="partnership-case"><div class="section-index">05 / PARTNERSHIP</div><h2>A collaborative project</h2><img class="partnership-logos" src="sidagro-logos.png" alt="IMA and OGEDAI laboratory logos"></section>');
    }
    const contextSection = document.querySelector('#case-content .case-section');
    if (project === 'ima' && contextSection) contextSection.classList.add('context-section', 'ima-context');
    if (project === 'ima' && contextSection) contextSection.querySelector('h2').innerHTML = 'A clear journey,<br>from registration to action.';
    if (project === 'ima') {
      const imaAbout = document.querySelector('.case-about');
      if (imaAbout) {
        const originalCopy = imaAbout.querySelector('p');
        originalCopy.className = 'ima-about-copy';
        originalCopy.innerHTML = '<span>The Minas Gerais Agricultural Registry is a government system developed with the Minas Gerais Agricultural Institute to manage and inspect producers and rural properties across the state.</span><span>As lead designer, I created a complete, robust design system capable of supporting the complexity of a large-scale government platform.</span><span>Beyond Figma, we used TypeScript, Node, and React to explore and validate complex real-world product flows.</span>';
      }
      if (contextSection) {
        const visual = contextSection.querySelector('.case-visual');
        const intro = document.createElement('div');
        intro.className = 'ima-context__intro';
        intro.append(contextSection.querySelector('.section-index'), contextSection.querySelector('h2'), contextSection.querySelector(':scope > p'));
        contextSection.insertBefore(intro, visual);
      }
    }
    if (false && project === 'ima' && contextSection) {
      const visual = contextSection.querySelector('.case-visual');
      const screens = ['sidagro-mock.png','ima-tela-1.png','ima-tela-2.png','ima-tela-3.png','ima-tela-5.png'];
      visual.innerHTML = `<div class="case-carousel">${screens.map((src,i)=>`<img class="${i===0?'active ':''}${i===3?'short-screen':''}" src="${src}" alt="Screen ${i+1} from the IMA project">`).join('')}<div class="carousel-dots">${screens.map((_,i)=>`<i class="${i===0?'active':''}"></i>`).join('')}</div><div class="carousel-controls"><button type="button" data-dir="-1" aria-label="Previous screen">←</button><button type="button" data-dir="1" aria-label="Next screen">→</button></div></div>`;
      const carousel = visual.querySelector('.case-carousel');
      carousel.querySelector('.carousel-controls').remove();
      const imgs = [...carousel.querySelectorAll('img')];
      const dots = [...carousel.querySelectorAll('.carousel-dots i')];
      let current = 0;
      const show = (index) => { current = (index + imgs.length) % imgs.length; imgs.forEach((img,i)=>img.classList.toggle('active',i===current)); dots.forEach((dot,i)=>dot.classList.toggle('active',i===current)); };
      carousel.querySelectorAll('button').forEach(button => button.addEventListener('click', () => show(current + Number(button.dataset.dir))));
      let dragStart = null;
      carousel.addEventListener('pointerdown', event => { dragStart = event.clientX; carousel.setPointerCapture(event.pointerId); });
      carousel.addEventListener('pointerup', event => { if (dragStart === null) return; const distance = event.clientX - dragStart; if (Math.abs(distance) > 45) show(current + (distance < 0 ? 1 : -1)); dragStart = null; });
      setInterval(() => show(current + 1), 5000);
    }
    if (project === 'ima' && contextSection) {
      const imaVisual = contextSection.querySelector('.case-visual');
      const imaScreens = ['sidagro-mock.png','ima-tela-1.png','ima-tela-2.png','ima-tela-3.png','ima-tela-5.png'];
      imaVisual.innerHTML = `<div class="ima-screen-gallery">${imaScreens.map((src,i)=>`<figure class="${i===0?'ima-screen-gallery__featured':''}"><img src="${src}" alt="Screen ${i+1} from the IMA project"><figcaption>Screen ${String(i+1).padStart(2,'0')} · Agricultural Registry</figcaption></figure>`).join('')}</div>`;
    }
    document.querySelectorAll('#case-content .case-section').forEach(section => {
      if (section.textContent.includes('02 / ECOSYSTEM')) section.classList.add('context-section');
      if (section.textContent.includes('02 / ECOSYSTEM')) section.classList.add('ecosystem-case');
      if (section.textContent.includes('03 / DESIGN PROCESS')) {
        section.classList.add('process-case');
        section.querySelectorAll('.case-meta > div').forEach((step, index) => { step.tabIndex = 0; step.setAttribute('aria-label', `Step ${index + 1}`); });
      }
    });
    const coverDetails = {
      ima: {label:'IMA',number:'01 / GOVERNMENT SYSTEM',image:'sidagro-mock.png',alt:'Agricultural Registry interface',meta:[['YEAR','2025'],['TYPE','Product Design'],['SECTOR','Government'],['PLATFORM','Web system']]},
      alumni: {label:'alumni',number:'02 / COMMUNITY',image:'alumni-tela-1.png',alt:'Alumni ESAL UFLA platform screen',meta:[['TYPE','UX/UI Design'],['FOCUS','Community'],['SECTOR','Education'],['PLATFORM','Web']]},
      eco: {label:'eco',number:'03 / CARBON CREDITS',image:'eco-tela-1.png',alt:'Eco platform screen',meta:[['TYPE','Product Design'],['MARKET','Carbon credits'],['FOCUS','Sustainability'],['PLATFORM','Web B2B']]}
    };
    const cover = coverDetails[project] || coverDetails.ima;
    const hero = document.querySelector('.case-hero');
    hero.className = 'case-hero project-cover';
    hero.innerHTML = `<div class="project-cover__inner"><a class="project-cover__back" href="index.html#projects">← All projects</a><span class="project-cover__number">${cover.number}</span><div class="project-cover__grid"><div><h1>${cover.label}</h1><p class="project-cover__lead">“${c.lead}”</p><div class="project-cover__meta">${cover.meta.map(item => `<div><span>${item[0]}</span><b>${item[1]}</b></div>`).join('')}</div></div><div class="project-cover__media"><img src="${cover.image}" alt="${cover.alt}"></div></div></div>`;
    if (project === 'eco') {
      hero.insertAdjacentHTML('afterend', `<section class="case-section eco-about"><div><div class="section-index">01 / ABOUT THE PROJECT</div><h2>Impact that<br>connects.</h2></div><div><p>Eco was born from the need to connect companies seeking to offset their carbon emissions with producers who preserve and regenerate the environment.</p><p>We developed a complete platform that makes carbon-credit trading transparent, secure, and accessible for everyone involved.</p><p>The result is a solution that connects stakeholders, promotes sustainable practices, and actively contributes to environmental preservation in Brazil.</p></div></section><section class="case-section eco-features"><div class="eco-features__head"><div><div class="section-index">02 / FEATURES</div><h2>One platform,<br>many connections.</h2></div><p>Tools designed to make every stage of a transaction simpler, more transparent, and more secure.</p></div><div class="eco-features__grid"><article class="eco-feature"><b>01</b><h3>Credit Marketplace</h3><p>A complete platform for buying and selling carbon credits through safe, transparent transactions.</p></article><article class="eco-feature"><b>02</b><h3>Real-Time Analytics</h3><p>An interactive dashboard with data visualization, impact metrics, and detailed reports.</p></article><article class="eco-feature"><b>03</b><h3>User Management</h3><p>A robust system for managing producers, buyers, and platform partners.</p></article></div></section>`);
      document.querySelectorAll('.eco-showcase .section-index')[0].textContent = '03 / PLATFORM';
      document.querySelector('.eco-dashboard .section-index').textContent = '04 / MANAGEMENT';
      document.querySelectorAll('.eco-showcase .section-index')[1].textContent = '05 / MARKET';
    }
    if (project === 'alumni' || project === 'eco') {
      const marqueeCopy = project === 'alumni'
        ? 'ALUMNI ESAL UFLA · COMMUNITY · EDUCATION · DONATIONS · CONNECTIONS · SOCIAL IMPACT · DIGITAL EXPERIENCE · '
        : 'CARBON CREDITS · SUSTAINABILITY · CARBON MARKET · POSITIVE IMPACT · TRANSPARENCY · ECO · WEB B2B · ';
      hero.insertAdjacentHTML('afterend', `<section class="project-marquee project-marquee--${project}" aria-label="Temas do projeto"><span>${marqueeCopy}</span><span aria-hidden="true">${marqueeCopy}</span></section>`);
      const projectMarquee = hero.nextElementSibling;
      projectMarquee.insertAdjacentHTML('afterend', `<section class="case-impact case-impact--project"><div class="impact-stats">${c.stats.map(stat => `<div class="impact-stat"><b>${stat[0]}</b><span>${stat[1]}</span></div>`).join('')}</div></section>`);
    }
    if (project === 'alumni') {
      document.querySelector('.project-marquee--alumni')?.classList.add('project-marquee--alumni-contrast');
      document.querySelector('.case-impact--project')?.remove();
      const alumniMarquee = document.querySelector('.project-marquee--alumni');
      alumniMarquee.insertAdjacentHTML('afterend', `<section class="alumni-highlights" aria-label="Alumni project pillars"><article><span>01 / COMMUNITY</span><h2>Connect<br>stories.</h2><p>A welcoming digital experience that brings alumni closer to the university and to one another.</p></article><article><span>02 / CONTRIBUTION</span><h2>Turn connection<br>into action.</h2><p>Donations presented clearly and humanely, tied directly to educational projects.</p></article><article><span>03 / EXPERIENCE</span><h2>Make impact<br>clear.</h2><p>Content, navigation, and calls to action organized to guide every next step.</p></article></section>`);
      document.querySelector('.case-footer').insertAdjacentHTML('beforebegin', '<section class="partnership-case partnership-case--ufla"><div class="section-index">04 / PARTNERSHIP</div><h2>A collaborative project</h2><p>Developed for the Federal University of Lavras.</p><img class="partnership-logos partnership-logos--ufla" src="ufla-logo-transparent.png" alt="Federal University of Lavras logo"></section>');
    }
    if (project === 'eco') {
      const ecoIndicators = [
        ['Credit marketplace', 'Buy and sell credits through safe, transparent transactions.'],
        ['Analytics and reports', 'Data, impact metrics, and reports that guide decisions.'],
        ['Users and partners', 'Manage producers, buyers, and partners in one place.']
      ];
      const impactStats = document.querySelector('.case-impact--project .impact-stats');
      impactStats.innerHTML = ecoIndicators.map(item => `<article class="impact-stat impact-stat--eco impact-stat--qualitative"><strong>${item[0]}</strong><span>${item[1]}</span></article>`).join('');
      document.querySelector('.eco-features')?.remove();
      document.querySelector('.case-footer').insertAdjacentHTML('beforebegin', '<section class="partnership-case partnership-case--zetta"><div class="section-index">06 / PARTNERSHIP</div><h2>A collaborative project</h2><p>Developed in collaboration with Zetta.</p><img class="partnership-logos partnership-logos--zetta" src="zetta-logo.png" alt="Zetta logo"></section>');
    }
    const connectionText = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
    const textNodes = [];
    while (connectionText.nextNode()) textNodes.push(connectionText.currentNode);
    textNodes.forEach(node => { node.nodeValue = node.nodeValue.replaceAll('+8.000', '+200'); });
  </script>
</body>
</html>
